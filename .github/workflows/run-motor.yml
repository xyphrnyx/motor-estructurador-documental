name: Ejecutar Motor Estructurador

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión del motor (carpeta dentro de versions/)"
        required: true
        type: string
        default: "beta6.1"

      model:
        description: "Modelo xAI/Grok a usar"
        required: true
        type: string
        default: "grok-4.7"

      source:
        description: "Ruta del documento fuente dentro del repositorio"
        required: true
        type: string
        default: "test-corpus/technical/hello-motor.txt"

      max_output_tokens:
        description: "Límite máximo de tokens de salida"
        required: true
        type: string
        default: "32000"

      fail_on_validation:
        description: "Fallar si no pasa la validación estructural"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  run-motor:
    name: Motor ${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      MOTOR_VERSION: ${{ inputs.version }}
      MOTOR_MODEL: ${{ inputs.model }}
      MOTOR_SOURCE: ${{ inputs.source }}
      MOTOR_MAX_OUTPUT_TOKENS: ${{ inputs.max_output_tokens }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Verificar archivos necesarios
        shell: bash
        run: |
          set -euo pipefail

          test -f "requirements.txt" || {
            echo "::error::No existe requirements.txt en la raíz del repositorio."
            exit 1
          }

          test -f "runner/run_motor.py" || {
            echo "::error::No existe runner/run_motor.py."
            exit 1
          }

          test -f "runner/extract_output.py" || {
            echo "::error::No existe runner/extract_output.py."
            exit 1
          }

          test -f "runner/validate_output.py" || {
            echo "::error::No existe runner/validate_output.py."
            exit 1
          }

          test -f "versions/$MOTOR_VERSION/prompt.md" || {
            echo "::error::No existe versions/$MOTOR_VERSION/prompt.md."
            exit 1
          }

          test -f "$MOTOR_SOURCE" || {
            echo "::error::No existe la fuente: $MOTOR_SOURCE"
            exit 1
          }

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Verificar secreto xAI
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        shell: bash
        run: |
          if [ -z "$XAI_API_KEY" ]; then
            echo "::error::Falta el secret XAI_API_KEY."
            exit 1
          fi

      - name: Ejecutar Motor
        id: motor
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          python runner/run_motor.py \
            --version "$MOTOR_VERSION" \
            --model "$MOTOR_MODEL" \
            --source "$MOTOR_SOURCE" \
            --max-output-tokens "$MOTOR_MAX_OUTPUT_TOKENS"

      - name: Validar salida estructural
        id: validate
        continue-on-error: true
        env:
          RUN_DIR: ${{ steps.motor.outputs.run_dir }}
        shell: bash
        run: |
          set -euo pipefail

          python runner/validate_output.py \
            "$RUN_DIR/motor-output.json" \
            --report "$RUN_DIR/validation.json"

      - name: Guardar resultados como artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: motor-${{ inputs.version }}-${{ github.run_id }}
          path: runs/
          if-no-files-found: warn
          retention-days: 14

      - name: Aplicar resultado de validación
        if: ${{ inputs.fail_on_validation && steps.validate.outcome == 'failure' }}
        run: |
          echo "::error::La salida no superó la validación estructural."
          exit 1
